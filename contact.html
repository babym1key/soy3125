<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>지원 창구 - 산불 이후 회복 안내</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/print.css">
</head>
<body data-page="contact">
  <main class="wrap">
    <div class="page-title">
      <h1>🏢 지원 창구 안내</h1>
      <p>어디로 가야 할지 모르겠다면, 먼저 <strong>주소지 읍·면·동 행정복지센터</strong>에 물어보세요.</p>
    </div>
    <div class="place-grid" id="contacts"></div>
  </main>

  <script src="js/common.js"></script>
  <script src="data/contacts.js"></script>
  <script src="js/render.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.getElementById("contacts").innerHTML = CONTACTS.map(function (c) { return placeCard(c); }).join("");
    });
  </script>

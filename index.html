<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>불이 꺼진 후, 다시 피어나는 강원</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/print.css">
</head>
<body data-page="landing" class="landing">
  <main class="wrap">
    <section class="hero hero-brand">
      <img class="emblem" src="img/emblem.svg" alt="">
      <div>
        <p class="hero-kicker">강원대학교와 함께하는 회복</p>
        <h1 class="brand-title" aria-label="불이 꺼진 후, 다시 피어나는 강원">
          <span class="bt-1">불이 꺼진 후</span>
          <span class="bt-2">다시 피어나는</span>
          <span class="bt-3">강원</span>

    <div class="entry-grid">
      <a class="entry entry-help" href="home.html">
        <span class="entry-ico" aria-hidden="true">🏠</span>
        <strong>산불 이재민이신가요?</strong>

        <span class="entry-go">할 일 확인하기 →</span>
      </a>
      <a class="entry entry-give" href="together.html">
        <span class="entry-ico" aria-hidden="true">🤲</span>
        <strong>따뜻한 손길 내밀기</strong>
        <span>봉사, 피해목 업사이클링, 결연 농가로 이재민 곁에 함께해요.</span>
        <span class="entry-go">함께하기 →</span>
      </a>
    </div>
  </main>

  <script src="js/common.js"></script>

</html>
